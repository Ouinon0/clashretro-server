<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin du serveur</title>
<style>
:root { --bg: #0b1730; --panel: #13264d; --panel2: #1a3366; --line: #2b4f93; --text: #eef3ff; --muted: #97acd6;
  --blue: #3d8bff; --green: #3fbf3a; --red: #e5484d; --gold: #ffd23f; --purple: #a259ff; }
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: #0e1f42; border-bottom: 2px solid var(--line);
  position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0 12px 0 0; }
nav { display: flex; gap: 6px; flex-wrap: wrap; }
nav button { background: transparent; color: var(--muted); border: 0; padding: 8px 12px; border-radius: 10px; font-weight: 650; cursor: pointer; }
nav button.on { background: var(--panel2); color: #fff; }
main { padding: 20px; max-width: 1200px; margin: 0 auto; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.stat b { display: block; font-size: 28px; }
.stat span { color: var(--muted); font-size: 13px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
section h2 { margin: 0 0 12px; font-size: 17px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #ffffff14; vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
tr:hover td { background: #ffffff06; }
input, select, textarea { background: #0a1733; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: inherit; }
textarea { width: 100%; min-height: 70px; }
label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 13px; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; align-items: end; }
button.act { background: var(--blue); color: #fff; border: 0; border-radius: 9px; padding: 8px 13px; font-weight: 700; cursor: pointer; }
button.act.green { background: var(--green); } button.act.red { background: var(--red); } button.act.ghost { background: #ffffff14; }
button.small { padding: 4px 8px; font-size: 13px; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #ffffff18; }
.pill.on { background: #3fbf3a33; color: #8dff86; } .pill.off { background: #e5484d33; color: #ff9b9e; }
.muted { color: var(--muted); } .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.code { font-family: ui-monospace, monospace; font-weight: 800; letter-spacing: 2px; color: var(--gold); }
#login { max-width: 360px; margin: 12vh auto; }
#toast { position: fixed; bottom: 20px; right: 20px; background: #000c; padding: 12px 16px; border-radius: 10px; display: none; }
.items .it { display: flex; gap: 6px; margin-bottom: 6px; }
pre { white-space: pre-wrap; font-size: 12.5px; max-height: 70vh; overflow: auto; }
@media (max-width: 700px) { main { padding: 12px; } th:nth-child(n+6):not(:last-child), td:nth-child(n+6):not(:last-child) { display: none; } }
</style>
</head>
<body>
<div id="login" hidden>
  <section>
    <h2>Admin du serveur</h2>
    <form id="loginForm" class="form" style="grid-template-columns:1fr">
      <label>Mot de passe <input type="password" id="pw" autocomplete="current-password" required></label>
      <button class="act" type="submit">Se connecter</button>
      <p class="muted">Le mot de passe est affiché dans le journal du serveur au premier démarrage, ou défini par la variable CLASH_ADMIN_PASSWORD.</p>
    </form>
  </section>
</div>
<div id="app" hidden>
  <header>
    <h1>⚔️ Admin</h1>
    <nav id="tabs"></nav>
    <span style="flex:1"></span>
    <button class="act ghost small" id="logout">Déconnexion</button>
  </header>
  <main id="view"></main>
</div>
<div id="toast"></div>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const toast = t => { const e = $("#toast"); e.textContent = t; e.style.display = "block"; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = "none", 2600); };
let meta = { cards: [], chests: [], modes: {} };

async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch("/api/" + path, opt);
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== "login") { showLogin(); throw new Error("connexion requise"); }
  if (!r.ok) { toast(data.error || ("Erreur " + r.status)); throw new Error(data.error || r.status); }
  return data;
}
const toLocal = t => { if (!t) return ""; const d = new Date(t * 1000); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const fromLocal = v => v ? Math.floor(new Date(v).getTime() / 1000) : 0;
const when = t => t ? new Date(t * 1000).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" }) : "—";
const cardName = id => (meta.cards.find(c => c.id === id) || {}).name || id;

const TABS = [["overview", "Vue d'ensemble"], ["players", "Joueurs"], ["events", "Événements"], ["shop", "Boutique"],
  ["invites", "Invitations"], ["news", "Actualités"], ["clans", "Clans"], ["settings", "Réglages"], ["log", "Journal"]];
let tab = location.hash.slice(1) || "overview";

function showLogin() { $("#app").hidden = true; $("#login").hidden = false; $("#pw").focus(); }
$("#loginForm").onsubmit = async e => {
  e.preventDefault();
  try { await api("login", { password: $("#pw").value }); $("#pw").value = ""; start(); } catch (err) {}
};
$("#logout").onclick = async () => { await api("logout", {}); showLogin(); };

async function start() {
  try { meta = await api("cards"); } catch (e) { return; }
  $("#login").hidden = true; $("#app").hidden = false;
  $("#tabs").innerHTML = TABS.map(([k, t]) => `<button data-k="${k}">${t}</button>`).join("");
  $("#tabs").onclick = e => { if (e.target.dataset.k) { tab = e.target.dataset.k; location.hash = tab; render(); } };
  render();
}

async function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.k === tab));
  const v = $("#view");
  try { v.innerHTML = await VIEWS[tab](); BIND[tab] && BIND[tab](); } catch (e) { v.innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
}

const VIEWS = {}, BIND = {};

// --- Vue d'ensemble --------------------------------------------------------------------------
VIEWS.overview = async () => {
  const o = await api("overview");
  const up = `${Math.floor(o.uptime / 86400)} j ${Math.floor(o.uptime % 86400 / 3600)} h ${Math.floor(o.uptime % 3600 / 60)} min`;
  const q = Object.entries(o.queues).filter(([, n]) => n > 0).map(([k, n]) => `${esc(k)} : ${n}`).join(", ") || "personne";
  return `<div class="grid">
    <div class="stat"><b>${o.online}</b><span>joueurs connectés</span></div>
    <div class="stat"><b>${o.accounts}</b><span>comptes</span></div>
    <div class="stat"><b>${o.matches.length}</b><span>combats en cours</span></div>
    <div class="stat"><b>${o.events_active}</b><span>événements actifs</span></div>
    <div class="stat"><b>${o.clans}</b><span>clans</span></div>
    <div class="stat"><b style="font-size:18px">${up}</b><span>en ligne depuis</span></div></div>
  <section style="margin-top:16px"><h2>Combats en cours</h2>${o.matches.length ? `<table><tr><th>N°</th><th>Mode</th><th>Joueurs</th><th>Durée</th></tr>
    ${o.matches.map(m => `<tr><td>${m.id}</td><td>${esc(m.mode)}</td><td>${m.players.map(esc).join(" · ")}</td><td>${m.seconds} s</td></tr>`).join("")}</table>` : `<p class="muted">Aucun.</p>`}
    <p class="muted">File d'attente : ${q}</p></section>
  <section><h2>Annonce immédiate</h2><div class="row"><input id="ann" style="flex:1" maxlength="300" placeholder="Message affiché à tous les joueurs connectés">
    <button class="act" id="annSend">Envoyer</button></div></section>`;
};
BIND.overview = () => { $("#annSend").onclick = async () => { const r = await api("announce", { text: $("#ann").value }); toast(`Envoyé à ${r.sent} joueur(s)`); $("#ann").value = ""; }; };

// --- Joueurs -----------------------------------------------------------------------------------
VIEWS.players = async () => {
  const { players } = await api("players");
  return `<section><h2>Joueurs (${players.length})</h2><p class="muted">Ni adresse IP ni appareil : le serveur n'en garde pas.</p>
  <div class="row" style="margin-bottom:10px"><input id="filter" placeholder="Rechercher un pseudo"></div>
  <table id="ptable"><tr><th>Pseudo</th><th>Niv.</th><th>Trophées</th><th>Or</th><th>Gemmes</th><th>V/D</th><th>Clan</th><th>Invité par</th><th>Vu</th><th></th></tr>
  ${players.map(p => `<tr data-name="${esc(p.name.toLowerCase())}"><td>${p.online ? "🟢 " : ""}<b>${esc(p.name)}</b> <span class="muted">#${p.id}</span>
    ${p.banned ? '<span class="pill off">suspendu</span>' : ""}</td><td>${p.level}</td><td>${p.trophies} <span class="muted">(${p.best})</span></td>
    <td>${p.gold}</td><td>${p.gems}</td><td>${p.wins}/${p.losses}</td><td>${esc(p.clan)}</td><td>${esc(p.invited_by)}</td><td>${esc(p.seen)}</td>
    <td><button class="act small" data-edit="${p.id}">Gérer</button></td></tr>`).join("")}</table></section><div id="pedit"></div>`;
};
BIND.players = () => {
  $("#filter").oninput = e => document.querySelectorAll("#ptable tr[data-name]").forEach(r => r.hidden = !r.dataset.name.includes(e.target.value.toLowerCase()));
  $("#ptable").onclick = async e => {
    const id = e.target.dataset.edit; if (!id) return;
    const { players } = await api("players"); const p = players.find(x => String(x.id) === id);
    $("#pedit").innerHTML = `<section><h2>${esc(p.name)} <span class="muted">#${p.id}</span></h2>
      <p class="muted">Créé le ${esc(p.created) || "?"} · deck : ${p.deck.map(cardName).map(esc).join(", ")}</p>
      <h3>Donner / retirer</h3><div class="form">
        <label>Or (±)<input type="number" id="g_gold" value="0"></label><label>Gemmes (±)<input type="number" id="g_gems" value="0"></label>
        <label>Carte<select id="g_card"><option value="">—</option>${meta.cards.map(c => `<option value="${c.id}">${esc(c.name)} (${c.rarity})</option>`).join("")}</select></label>
        <label>Nombre de cartes<input type="number" id="g_count" value="1" min="1"></label>
        <label>Coffre (emplacement libre)<select id="g_chest"><option value="">—</option>${meta.chests.map(c => `<option>${c}</option>`).join("")}</select></label>
        <button class="act green" id="g_go">Donner</button></div>
      <h3>Modifier</h3><div class="form">
        <label>Pseudo<input id="s_name" value="${esc(p.name)}" maxlength="16"></label><label>Trophées<input type="number" id="s_troph" value="${p.trophies}"></label>
        <label>Niveau du roi<input type="number" id="s_level" value="${p.level}" min="1" max="13"></label><button class="act" id="s_go">Enregistrer</button></div>
      <h3>Actions</h3><div class="row">
        <button class="act ghost" data-a="max_cards">Toutes les cartes au max</button>
        <button class="act ${p.banned ? "green" : "red"}" data-a="${p.banned ? "unban" : "ban"}">${p.banned ? "Réactiver" : "Suspendre"}</button>
        <button class="act red" data-a="reset">Réinitialiser la progression</button>
        <button class="act red" data-a="delete">Supprimer le compte</button></div></section>`;
    const act = async (body, msg) => { await api("players/" + id, body); toast(msg); render(); };
    $("#g_go").onclick = () => act({ action: "grant", gold: +$("#g_gold").value, gems: +$("#g_gems").value, card: $("#g_card").value,
      count: +$("#g_count").value, chest: $("#g_chest").value }, "Envoyé");
    $("#s_go").onclick = () => act({ action: "set", name: $("#s_name").value, trophies: +$("#s_troph").value, level: +$("#s_level").value }, "Enregistré");
    $("#pedit").querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
      if (["reset", "delete"].includes(b.dataset.a) && !confirm("Sûr ? C'est définitif.")) return;
      act({ action: b.dataset.a }, "Fait");
    });
    $("#pedit").scrollIntoView({ behavior: "smooth" });
  };
};

// --- Événements -----------------------------------------------------------------------------------
const COLORS = ["blue", "purple", "gold", "green", "red"];
VIEWS.events = async () => {
  const { events, now } = await api("events");
  const state = e => e.starts > now ? '<span class="pill">à venir</span>' : (e.ends && e.ends <= now ? '<span class="pill off">fini</span>' : '<span class="pill on">en cours</span>');
  return `<section><h2>Nouvel événement</h2><p class="muted">Affiché dans l'onglet Événements de l'appli. Les bonus s'appliquent à tous les combats et coffres pendant l'événement ;
  un mode de jeu ajoute un bouton « Jouer » (file d'attente dédiée, IA si personne).</p>${eventForm({})}</section>
  <section><h2>Événements</h2><table><tr><th>Titre</th><th>État</th><th>Début</th><th>Fin</th><th>Bonus</th><th>Mode</th><th></th></tr>
  ${events.map(e => `<tr><td><b>${esc(e.title)}</b><br><span class="muted">${esc(e.message)}</span></td><td>${state(e)}</td><td>${when(e.starts)}</td><td>${when(e.ends)}</td>
    <td>or ×${e.gold_percent / 100} · cartes ×${e.cards_percent / 100}</td><td>${esc(meta.modes[e.mode] || "")} ${e.mode ? esc(e.team) : ""}</td>
    <td><button class="act small" data-ed='${esc(JSON.stringify(e))}'>Modifier</button> <button class="act red small" data-del="${e.id}">×</button></td></tr>`).join("") || '<tr><td colspan=7 class="muted">Aucun.</td></tr>'}</table></section>`;
};
function eventForm(e) {
  const now = Math.floor(Date.now() / 1000);
  return `<form id="evf" class="form" data-id="${esc(e.id || "")}">
    <label>Titre<input name="title" required maxlength="48" value="${esc(e.title || "")}"></label>
    <label>Couleur<select name="color">${COLORS.map(c => `<option ${c === e.color ? "selected" : ""}>${c}</option>`).join("")}</select></label>
    <label>Début<input type="datetime-local" name="starts" value="${toLocal(e.starts || now)}"></label>
    <label>Fin<input type="datetime-local" name="ends" value="${toLocal(e.ends || now + 2 * 86400)}"></label>
    <label>Or (%)<input type="number" name="gold_percent" value="${e.gold_percent ?? 100}" min="0"></label>
    <label>Cartes des coffres (%)<input type="number" name="cards_percent" value="${e.cards_percent ?? 100}" min="0"></label>
    <label>Mode de jeu<select name="mode">${Object.entries(meta.modes).map(([k, t]) => `<option value="${k}" ${k === (e.mode || "") ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></label>
    <label>Format<select name="team"><option value="1v1">1 contre 1</option><option value="2v2" ${e.team === "2v2" ? "selected" : ""}>2 contre 2</option></select></label>
    <label><span><input type="checkbox" name="trophies" ${e.trophies ? "checked" : ""}> Trophées en jeu</span></label>
    <label><span><input type="checkbox" name="chests" ${e.chests ? "checked" : ""}> Coffres de victoire</span></label>
    <label style="grid-column:1/-1">Message<textarea name="message" maxlength="240">${esc(e.message || "")}</textarea></label>
    <button class="act green" type="submit">${e.id ? "Enregistrer" : "Créer"}</button></form>`;
}
BIND.events = () => {
  const bindForm = () => $("#evf").onsubmit = async ev => {
    ev.preventDefault(); const f = new FormData(ev.target);
    await api("events", { id: ev.target.dataset.id, title: f.get("title"), color: f.get("color"), starts: fromLocal(f.get("starts")), ends: fromLocal(f.get("ends")),
      gold_percent: +f.get("gold_percent"), cards_percent: +f.get("cards_percent"), mode: f.get("mode"), team: f.get("team"),
      trophies: f.get("trophies") === "on", chests: f.get("chests") === "on", message: f.get("message") });
    toast("Événement enregistré"); render();
  };
  bindForm();
  $("#view").onclick = async e => {
    if (e.target.dataset.del && confirm("Supprimer ?")) { await api(`events/${e.target.dataset.del}/delete`, {}); render(); }
    if (e.target.dataset.ed) { $("#evf").outerHTML = eventForm(JSON.parse(e.target.dataset.ed)); bindForm(); window.scrollTo(0, 0); }
  };
};

// --- Boutique ------------------------------------------------------------------------------------------
VIEWS.shop = async () => {
  const [{ offers, now }, { settings }] = await Promise.all([api("offers"), api("settings")]);
  const S = Object.fromEntries(settings.map(s => [s.key, s.value]));
  const desc = o => o.items.map(i => i.kind === "card" ? `${i.n}× ${esc(cardName(i.id))}` : i.kind === "chest" ? `${i.n}× coffre ${esc(i.id)}` : `${i.n} ${i.kind === "gold" ? "or" : "gemmes"}`).join(", ");
  return `<section><h2>Réglages de la boutique</h2><div class="form">
    <label>Prix (% du prix normal)<input type="number" id="shop_percent" value="${S.shop_percent}"></label>
    <label>Or contre gemmes [[or, gemmes], …]<input id="gold_packs" value="${esc(JSON.stringify(S.gold_packs))}"></label>
    <button class="act" id="shopSave">Enregistrer</button></div>
    <p class="muted">Les cartes du jour (une commune, une rare, une épique de l'arène du joueur) et les coffres Magique / Géant / Super magique changent chaque jour.</p></section>
  <section><h2>Nouvelle offre spéciale</h2>${offerForm({})}</section>
  <section><h2>Offres spéciales</h2><table><tr><th>Titre</th><th>Contenu</th><th>Prix</th><th>Limite</th><th>Période</th><th></th></tr>
  ${offers.map(o => `<tr><td><b>${esc(o.title)}</b></td><td>${desc(o)}</td><td>${o.price ? `${o.price} ${o.currency === "gold" ? "or" : "gemmes"}` : "gratuit"}</td>
    <td>${o.limit || "∞"} / joueur</td><td>${when(o.starts)} → ${o.ends ? when(o.ends) : "sans fin"}</td>
    <td><button class="act small" data-ed='${esc(JSON.stringify(o))}'>Modifier</button> <button class="act red small" data-del="${o.id}">×</button></td></tr>`).join("") || '<tr><td colspan=6 class="muted">Aucune.</td></tr>'}</table></section>`;
};
function itemRow(i = { kind: "gold", n: 1000 }) {
  return `<div class="it"><select class="k">${["gold", "gems", "card", "chest"].map(k => `<option ${k === i.kind ? "selected" : ""}>${k}</option>`).join("")}</select>
    <select class="id">${(i.kind === "chest" ? meta.chests.map(c => [c, c]) : meta.cards.map(c => [c.id, c.name])).map(([v, t]) => `<option value="${v}" ${v === i.id ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
    <input class="n" type="number" min="1" value="${i.n}" style="width:110px"><button type="button" class="act red small rm">×</button></div>`;
}
function offerForm(o) {
  const now = Math.floor(Date.now() / 1000);
  return `<form id="off" class="form" data-id="${esc(o.id || "")}">
    <label>Titre<input name="title" required maxlength="48" value="${esc(o.title || "")}"></label>
    <label>Prix (0 = gratuit)<input type="number" name="price" min="0" value="${o.price ?? 0}"></label>
    <label>Monnaie<select name="currency"><option value="gems">gemmes</option><option value="gold" ${o.currency === "gold" ? "selected" : ""}>or</option></select></label>
    <label>Achats par joueur (0 = illimité)<input type="number" name="limit" min="0" value="${o.limit ?? 1}"></label>
    <label>Début<input type="datetime-local" name="starts" value="${toLocal(o.starts || now)}"></label>
    <label>Fin (vide = sans fin)<input type="datetime-local" name="ends" value="${toLocal(o.ends)}"></label>
    <div style="grid-column:1/-1"><span class="muted">Contenu (or, gemmes, carte, coffre)</span><div class="items">${(o.items || [{ kind: "gold", n: 1000 }]).map(itemRow).join("")}</div>
    <button type="button" class="act ghost small" id="addItem">+ élément</button></div>
    <button class="act green" type="submit">${o.id ? "Enregistrer" : "Créer"}</button></form>`;
}
BIND.shop = () => {
  $("#shopSave").onclick = async () => { await api("settings", { shop_percent: +$("#shop_percent").value, gold_packs: $("#gold_packs").value }); toast("Enregistré"); };
  const bindForm = () => {
    const f = $("#off");
    f.querySelector("#addItem").onclick = () => f.querySelector(".items").insertAdjacentHTML("beforeend", itemRow());
    f.onclick = e => { if (e.target.classList.contains("rm")) e.target.parentElement.remove(); };
    f.onchange = e => { if (e.target.classList.contains("k")) { const row = e.target.parentElement; row.outerHTML = itemRow({ kind: e.target.value, n: +row.querySelector(".n").value }); } };
    f.onsubmit = async ev => {
      ev.preventDefault(); const d = new FormData(f);
      const items = [...f.querySelectorAll(".it")].map(r => ({ kind: r.querySelector(".k").value, id: r.querySelector(".id").value, n: +r.querySelector(".n").value }));
      await api("offers", { id: f.dataset.id, title: d.get("title"), price: +d.get("price"), currency: d.get("currency"), limit: +d.get("limit"),
        starts: fromLocal(d.get("starts")), ends: fromLocal(d.get("ends")), items });
      toast("Offre enregistrée"); render();
    };
  };
  bindForm();
  $("#view").onclick = async e => {
    if (e.target.dataset.del && confirm("Supprimer ?")) { await api(`offers/${e.target.dataset.del}/delete`, {}); render(); }
    if (e.target.dataset.ed) { $("#off").outerHTML = offerForm(JSON.parse(e.target.dataset.ed)); bindForm(); window.scrollTo(0, 0); }
  };
};

// --- Invitations ---------------------------------------------------------------------------------------
VIEWS.invites = async () => {
  const { invites, access_mode } = await api("invites");
  const link = c => `${location.origin}/i/${c}`;
  return `<section><h2>Accès au serveur</h2><p>Mode actuel : <b>${esc(access_mode)}</b> ${access_mode !== "invite" ? '<span class="muted">(les invitations ne sont demandées qu\'en mode « invite » : voir Réglages)</span>' : ""}</p>
    <div class="form"><label>Note (pour qui ?)<input id="inote" maxlength="60"></label><label>Utilisations<input type="number" id="iuses" value="1" min="1"></label>
    <button class="act green" id="inew">Créer une invitation</button></div></section>
  <section><h2>Invitations</h2><table><tr><th>Code</th><th>Lien</th><th>Créée par</th><th>Note</th><th>Utilisée</th><th>Expire</th><th></th></tr>
  ${invites.map(i => `<tr><td class="code">${esc(i.code)}</td><td><a href="${link(i.code)}" target="_blank" style="color:var(--blue)">${esc(link(i.code))}</a></td>
    <td>${esc(i.by_name)}</td><td>${esc(i.note)}</td><td>${i.uses}/${i.max_uses} ${i.used_names.length ? "· " + i.used_names.map(esc).join(", ") : ""}</td>
    <td>${i.expires ? when(i.expires) : "jamais"}</td><td>${i.usable ? `<button class="act red small" data-rev="${i.code}">Annuler</button>` : '<span class="pill off">inactive</span>'}</td></tr>`).join("") || '<tr><td colspan=7 class="muted">Aucune.</td></tr>'}</table></section>`;
};
BIND.invites = () => {
  $("#inew").onclick = async () => { await api("invites", { note: $("#inote").value, max_uses: +$("#iuses").value }); toast("Invitation créée"); render(); };
  $("#view").onclick = async e => { if (e.target.dataset.rev) { await api(`invites/${e.target.dataset.rev}/revoke`, {}); render(); } };
};

// --- Actualités -------------------------------------------------------------------------------------------
VIEWS.news = async () => {
  const { news } = await api("news");
  return `<section><h2>Nouvelle actualité</h2><p class="muted">Visible dans l'onglet Événements de l'appli (10 dernières).</p>
    <form id="nf" class="form"><label>Titre<input name="title" required maxlength="64"></label><label style="grid-column:1/-1">Texte<textarea name="text" maxlength="1000"></textarea></label>
    <button class="act green" type="submit">Publier</button></form></section>
  <section><h2>Actualités</h2><table><tr><th>Date</th><th>Titre</th><th>Texte</th><th></th></tr>
  ${news.slice().reverse().map(n => `<tr><td>${when(n.at)}</td><td><b>${esc(n.title)}</b></td><td>${esc(n.text)}</td><td><button class="act red small" data-del="${n.id}">×</button></td></tr>`).join("") || '<tr><td colspan=4 class="muted">Aucune.</td></tr>'}</table></section>`;
};
BIND.news = () => {
  $("#nf").onsubmit = async e => { e.preventDefault(); const f = new FormData(e.target); await api("news", { title: f.get("title"), text: f.get("text") }); toast("Publié"); render(); };
  $("#view").onclick = async e => { if (e.target.dataset.del && confirm("Supprimer ?")) { await api(`news/${e.target.dataset.del}/delete`, {}); render(); } };
};

// --- Clans ----------------------------------------------------------------------------------------------
VIEWS.clans = async () => {
  const { clans } = await api("clans");
  return `<section><h2>Clans (${clans.length})</h2><table><tr><th>Nom</th><th>Chef</th><th>Membres</th><th></th></tr>
  ${clans.map(c => `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.leader)}</td><td>${c.members.length} : ${c.members.map(esc).join(", ")}</td>
    <td><button class="act small" data-ren="${esc(c.id)}">Renommer</button> <button class="act red small" data-del="${esc(c.id)}">Dissoudre</button></td></tr>`).join("") || '<tr><td colspan=4 class="muted">Aucun.</td></tr>'}</table></section>`;
};
BIND.clans = () => {
  $("#view").onclick = async e => {
    if (e.target.dataset.del && confirm("Dissoudre ce clan ?")) { await api(`clans/${e.target.dataset.del}/delete`, {}); render(); }
    if (e.target.dataset.ren) { const n = prompt("Nouveau nom"); if (n) { await api(`clans/${e.target.dataset.ren}/rename`, { name: n }); render(); } }
  };
};

// --- Réglages -------------------------------------------------------------------------------------------
VIEWS.settings = async () => {
  const { settings } = await api("settings");
  return `<section><h2>Réglages du serveur</h2><form id="sf" class="form">
  ${settings.map(s => `<label>${esc(s.label)}<input name="${s.key}" value="${esc(typeof s.value === "object" ? JSON.stringify(s.value) : s.value)}"></label>`).join("")}
  <button class="act green" type="submit">Enregistrer</button></form></section>
  <section><h2>Mot de passe de l'admin</h2><div class="form"><label>Nouveau mot de passe (8 caractères min.)<input type="password" id="npw" autocomplete="new-password"></label>
  <button class="act" id="pwgo">Changer</button></div></section>`;
};
BIND.settings = () => {
  $("#sf").onsubmit = async e => { e.preventDefault(); await api("settings", Object.fromEntries(new FormData(e.target))); toast("Réglages enregistrés"); render(); };
  $("#pwgo").onclick = async () => { await api("password", { password: $("#npw").value }); toast("Mot de passe changé"); $("#npw").value = ""; };
};

// --- Journal ---------------------------------------------------------------------------------------------
VIEWS.log = async () => {
  const { log } = await api("log");
  return `<section><h2>Journal (anonyme : pseudos et combats, pas d'adresse)</h2><pre>${log.slice().reverse().map(esc).join("\n") || "vide"}</pre></section>`;
};

window.onhashchange = () => { const t = location.hash.slice(1); if (t && t !== tab && VIEWS[t]) { tab = t; render(); } };
start();
</script>
</body>
</html>
