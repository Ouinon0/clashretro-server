{% extends "base.html" %}
{% block content %}
<section>
  <h2>Connexion</h2>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <p><input name="username" placeholder="Pseudo" required autocomplete="username"></p>
    <p><input name="password" type="password" placeholder="Mot de passe" required autocomplete="current-password"></p>
    <button>Se connecter</button>
  </form>
  <p class="muted">Pas de compte ? Il faut une invitation d'un joueur.</p>
</section>
{% endblock %}
