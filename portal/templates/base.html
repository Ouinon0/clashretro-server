<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClashRetro</title>
  <style>
    :root { --bg: #f6f7f9; --fg: #1d2330; --muted: #667085; --card: #fff; --line: #e3e6ea; --accent: #2f5bd3; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14171c; --fg: #e8eaee; --muted: #98a2b3; --card: #1c2027; --line: #2c323c; --accent: #7c9cf5; }
    }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    header { display: flex; gap: 16px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    header nav { margin-left: auto; display: flex; gap: 12px; align-items: center; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { color: var(--muted); font-weight: 600; }
    input, select, button { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
    button { background: var(--accent); color: #fff; border: 0; cursor: pointer; }
    button.link { background: none; color: var(--accent); padding: 0; }
    form.inline { display: inline-flex; gap: 6px; align-items: center; margin: 0; }
    .flash { background: var(--card); border-left: 4px solid var(--accent); padding: 8px 12px; margin-bottom: 12px; word-break: break-all; }
    .muted { color: var(--muted); }
    code { font-size: 15px; }
  </style>
</head>
<body>
<header>
  <strong>ClashRetro</strong>
  {% if user %}
  <nav>
    <a href="{{ url_for('home') }}">Mon compte</a>
    {% if user.can_admin %}<a href="{{ url_for('admin') }}">Admin</a>{% endif %}
    <form class="inline" method="post" action="{{ url_for('logout') }}">
      <input type="hidden" name="csrf" value="{{ csrf }}"><button class="link">Déconnexion</button>
    </form>
  </nav>
  {% endif %}
</header>
<main>
  {% for message in get_flashed_messages() %}<div class="flash">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
