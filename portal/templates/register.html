{% extends "base.html" %}
{% block content %}
<section>
  <h2>Créer un compte</h2>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <p><input name="code" placeholder="Code d'invitation" value="{{ code }}" required></p>
    <p><input name="username" placeholder="Pseudo" required autocomplete="username"></p>
    <p><input name="password" type="password" placeholder="Mot de passe (10 caractères min.)" required autocomplete="new-password"></p>
    <button>Créer mon compte</button>
  </form>
</section>
{% endblock %}
