# Clash Royale : Modern Classic — TrueNAS SCALE (Apps → Discover → ⋮ → Install via YAML).
#
# Seul le chemin du dossier des données est à adapter (ici /mnt/Pool2/data/clash/modern, à côté des données de l'ancien serveur) : il est
# créé au premier lancement avec les bons droits. Ensuite :
#   - admin web : http://IP_DU_NAS:19341/admin (mot de passe : journal de l'app au premier
#     démarrage, ou CLASH_ADMIN_PASSWORD ci-dessous) ;
#   - dans l'appli : Menu ☰ → Paramètres → Serveur = IP_DU_NAS ;
#   - l'APK à télécharger par les amis : déposer clash-modern.apk dans le dossier des données.

name: clash

services:
  init:
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /data && chown -R 950:950 /data"]
    volumes:
      - /mnt/Pool2/data/clash/modern:/data
    restart: "no"

  clash:
    image: ghcr.io/ouinon0/clashretro-modern:latest
    user: "950:950"
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "19340:19340/udp"
      - "19341:19341/tcp"
    volumes:
      - /mnt/Pool2/data/clash/modern:/data
    environment:
      TZ: Europe/Paris
      # CLASH_ADMIN_PASSWORD: "change-moi"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
