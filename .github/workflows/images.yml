# Construit et publie les images du serveur sur ghcr.io à chaque push sur main.
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: clashretro-game
            context: .
            file: docker/game.Dockerfile
          - name: clashretro-portal
            context: portal
            file: portal/Dockerfile
          - name: clashretro-db
            context: .
            file: docker/db.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ouinon0/${{ matrix.name }}:latest
            ghcr.io/ouinon0/${{ matrix.name }}:${{ github.sha }}
