# Clash Royale : Modern Classic, serveur entre amis.
#
#   docker compose up -d        puis ouvrir http://IP_DU_SERVEUR:19341/admin
#
# Le mot de passe de l'admin web est écrit dans le journal au premier démarrage
# (docker compose logs clash), ou fixé par CLASH_ADMIN_PASSWORD ci-dessous.
# Pour que tes amis téléchargent l'appli depuis la page d'accueil, dépose l'APK
# sous le nom clash-modern.apk dans le dossier des données (./data).

name: clash

services:
  clash:
    image: ghcr.io/ouinon0/clashretro-modern:latest
    container_name: clash
    restart: unless-stopped
    ports:
      - "19340:19340/udp"   # le jeu (l'appli s'y connecte)
      - "19341:19341/tcp"     # page d'accueil, invitations, /admin
    volumes:
      - ./data:/data        # comptes, clans, réglages, événements… (sauvegarde ce dossier)
    environment:
      TZ: Europe/Paris
      # CLASH_ADMIN_PASSWORD: "change-moi"   # sinon, mot de passe généré (voir le journal)
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
